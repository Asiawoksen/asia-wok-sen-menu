<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Küche – Asia Wok Sen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0b5b34; min-height: 100vh; padding-bottom: 20px; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(160deg, #16814c, #062d1b); }
.login-box { background: white; border-radius: 24px; padding: 36px 28px; text-align: center; width: 90%; max-width: 320px; }
.login-box .icon { font-size: 48px; margin-bottom: 12px; }
.login-box h2 { color: #0b5b34; margin-bottom: 6px; font-size: 22px; }
.login-box p { color: #888; font-size: 14px; margin-bottom: 24px; }
.login-box input { width: 100%; border: 2px solid #ddd; border-radius: 12px; padding: 13px; font-size: 16px; text-align: center; letter-spacing: 4px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #0b5b34; }
.login-box button { width: 100%; background: #0b5b34; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
.pw-error { color: #d81b86; font-size: 13px; margin-top: 10px; display: none; }
header { background: #062d1b; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 18px; }
#conn { font-size: 13px; }
#badge { background: #d81b86; color: white; border-radius: 999px; padding: 4px 14px; font-weight: 900; font-size: 15px; }
.btn-sound { background: rgba(255,255,255,0.15); color: white; border: none; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
main { padding: 14px; max-width: 640px; margin: 0 auto; }
#empty { color: rgba(255,255,255,0.5); text-align: center; padding: 60px 20px; font-size: 18px; }
.card { background: white; border-radius: 18px; padding: 18px; margin-bottom: 14px; border-left: 6px solid #d81b86; animation: pop 0.3s ease; }
.card.mitnehmen { border-left-color: #e65100; }
.card.done { border-left-color: #bbb; opacity: 0.5; }
@keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.tisch-label { font-size: 26px; font-weight: 900; color: #0b5b34; }
.new-tag { background: #d81b86; color: white; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; margin-left: 8px; }
.zeit-label { font-size: 12px; color: #888; }
.order-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
.order-row:last-of-type { border: none; }
.qty-tag { background: #0b5b34; color: white; border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800; margin-right: 6px; }
.total-row { text-align: right; font-weight: 900; color: #0b5b34; font-size: 16px; margin-top: 10px; }
.note-row { background: #fff8e1; border-left: 3px solid #ffc107; border-radius: 8px; padding: 8px 10px; font-size: 13px; color: #666; margin-top: 8px; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-done { flex: 2; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; background: #0b5b34; color: white; }
.btn-done.done-state { background: #ddd; color: #555; }
.btn-delete { flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; background: #ff3b3b; color: white; }
</style>
</head>
<body>
<header>
  <span id="conn" style="color:#aaa">● Verbinde...</span>
  <h1>🍳 Küche – Asia Wok Sen</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-sound" id="btn-sound" onclick="toggleSound()">🔔 Ton AN</button>
    <span id="badge">0</span>
  </div>
</header>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="icon">🍳</div>
    <h2>Küche – Asia Wok Sen</h2>
    <p>Nur für Mitarbeiter</p>
    <input type="password" id="pw-input" placeholder="Passwort" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">Einloggen</button>
    <div class="pw-error" id="pw-error">❌ Falsches Passwort</div>
  </div>
</div>

<!-- MAIN -->
<div id="main-content" style="display:none">
<div id="activate-banner" onclick="initAudio()" style="background:#d81b86;color:white;text-align:center;padding:14px;font-size:15px;font-weight:800;cursor:pointer;">
  🔔 Hier tippen um Benachrichtigungston zu aktivieren!
</div>
<main>
  <div id="empty">⏳ Warte auf Bestellungen...</div>
  <div id="list"></div>
</main>
</div> <!-- end main-content -->

<script>
var KW_PASSWORD = 'linhdeptrai';

function checkPw() {
  var val = document.getElementById('pw-input').value.trim();
  if (val === KW_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    requestNotificationPermission();
    loadAll();
    setInterval(pollNew, 3000);
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    setTimeout(function() { document.getElementById('pw-error').style.display = 'none'; }, 3000);
  }
}
var soundOn = true;
var count = 0;
var DB = 'https://asia-wok-sen-default-rtdb.europe-west1.firebasedatabase.app/bestellungen';
var lastTimestamp = Date.now();
var audioCtx = null;
var audioReady = false;

// Khởi động AudioContext sau khi người dùng chạm màn hình
function initAudio() {
  if (audioReady) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Phát âm thanh im lặng để "mở khóa" trình duyệt
    var buf = audioCtx.createBuffer(1, 1, 22050);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
    audioReady = true;
    document.getElementById('activate-banner').style.display = 'none';
    console.log('Audio ready');
  } catch(e) {
    console.log('Audio init error:', e);
  }
}

// Kích hoạt âm thanh khi người dùng chạm bất kỳ đâu
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

var VAPID_KEY = 'BJeZABCynOdowAmdSmrh0cZYb-4rkLaREiAd3PePFkNLypwp6QS9UafrFwF6PqabN4sXP65qVo3IvX9Fit4FcKU';
var fcmToken = null;

// Đăng ký Service Worker và FCM
function initFCM() {
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return;

  Notification.requestPermission().then(function(permission) {
    if (permission !== 'granted') return;

    // Đăng ký service worker
    navigator.serviceWorker.register('/asia-wok-sen-menu/firebase-messaging-sw.js')
      .then(function(reg) {
        console.log('SW registered');

        // Import Firebase Messaging
        return import('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js')
          .then(function(mod) {
            var app = firebase_app_instance;
            var messaging = mod.getMessaging(app);

            // Lấy FCM token
            return mod.getToken(messaging, { 
              vapidKey: VAPID_KEY,
              serviceWorkerRegistration: reg
            });
          });
      })
      .then(function(token) {
        if (token) {
          fcmToken = token;
          console.log('FCM Token:', token);
          // Lưu token vào Firebase để server gửi notification
          saveFCMToken(token);
        }
      })
      .catch(function(e) { console.log('FCM error:', e); });
  });
}

function saveFCMToken(token) {
  fetch('https://asia-wok-sen-default-rtdb.europe-west1.firebasedatabase.app/fcm_tokens.json', {
    method: 'POST',
    body: JSON.stringify({
      token: token,
      device: navigator.userAgent.substring(0, 50),
      time: Date.now()
    })
  });
}

// Thông báo local (khi app đang mở)
function sendNotification(order) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var type = order.orderType === 'mitnehmen' ? '🥡 Mitnehmen' : '🍽️ Hier essen';
  var body = type + ' – Gesamt: ' + order.total + ' €\n';
  (order.items || []).slice(0, 3).forEach(function(it) {
    body += '• ' + it.qty + '× ' + it.name + '\n';
  });
  new Notification('🍳 Neue Bestellung – ' + (order.tisch || '?'), {
    body: body,
    tag: 'new-order-' + Date.now(),
    requireInteraction: true,
    vibrate: [200, 100, 200]
  });
}

function requestNotificationPermission() {
  initFCM();
}
  soundOn = !soundOn;
  document.getElementById('btn-sound').textContent = soundOn ? '🔔 Ton AN' : '🔕 Ton AUS';
}

function beep() {
  if (!soundOn || !audioReady || !audioCtx) return;
  try {
    [0, 250, 500].forEach(function(delay) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.value = 880;
      var t = audioCtx.currentTime + delay / 1000;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.start(t);
      o.stop(t + 0.4);
    });
  } catch(e) {
    console.log('Beep error:', e);
  }
}

function renderCard(key, order, isNew) {
  document.getElementById('empty').style.display = 'none';
  if (isNew) {
    count++;
    document.getElementById('badge').textContent = count;
    beep();
    sendNotification(order);
  }

  var rows = '';
  (order.items || []).forEach(function(it) {
    rows += '<div class="order-row"><span><span class="qty-tag">' + it.qty + '×</span>' + it.name + '</span><span>' + parseFloat(it.subtotal).toFixed(2).replace('.', ',') + ' €</span></div>';
    if (it.note) rows += '<div style="font-size:12px;color:#888;padding:2px 0 4px 28px">📝 ' + it.note + '</div>';
  });

  var noteHtml = order.note ? '<div class="note-row">📝 ' + order.note + '</div>' : '';
  var isDone = order.status === 'fertig';

  var card = document.createElement('div');
  card.className = 'card' + (isDone ? ' done' : '') + (order.orderType === 'mitnehmen' ? ' mitnehmen' : '');
  card.id = 'card-' + key;
  var typeBadge = order.orderType === 'mitnehmen'
    ? '<span style="background:#e65100;color:white;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;margin-left:6px">🥡 Mitnehmen</span>'
    : '<span style="background:#0b5b34;color:white;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;margin-left:6px">🍽️ Hier essen</span>';

  card.innerHTML =
    '<div class="card-top">' +
      '<div><span class="tisch-label">👤 ' + order.tisch + '</span>' + typeBadge + (isNew ? '<span class="new-tag">NEU!</span>' : '') + '</div>' +
      '<span class="zeit-label">' + order.zeit + '</span>' +
    '</div>' +
    rows +
    '<div class="total-row">Gesamt: ' + order.total + ' €</div>' +
    noteHtml +
    '<div class="btn-row">' +
      '<button class="btn-done' + (isDone ? ' done-state' : '') + '" id="btn-' + key + '" onclick="toggle(\'' + key + '\')">' +
        (isDone ? '↩ Wieder öffnen' : '✅ Fertig') +
      '</button>' +
      '<button class="btn-delete" onclick="deleteOrder(\'' + key + '\')">🗑 Löschen</button>' +
    '</div>';

  var list = document.getElementById('list');
  list.insertBefore(card, list.firstChild);
}

function toggle(key) {
  var card = document.getElementById('card-' + key);
  var btn = document.getElementById('btn-' + key);
  var isDone = card.classList.contains('done');
  var newStatus = isDone ? 'neu' : 'fertig';
  fetch(DB + '/' + key + '.json', {
    method: 'PATCH',
    body: JSON.stringify({ status: newStatus })
  });
  card.classList.toggle('done');
  btn.classList.toggle('done-state');
  btn.textContent = isDone ? '✅ Fertig' : '↩ Wieder öffnen';
}

function deleteOrder(key) {
  if (!confirm('Bestellung wirklich löschen?')) return;
  fetch(DB + '/' + key + '.json', { method: 'DELETE' })
    .then(function() {
      var card = document.getElementById('card-' + key);
      if (card) {
        card.style.transition = 'opacity 0.3s';
        card.style.opacity = '0';
        setTimeout(function() {
          card.remove();
          count = Math.max(0, count - 1);
          document.getElementById('badge').textContent = count;
          if (document.getElementById('list').children.length === 0) {
            document.getElementById('empty').style.display = 'block';
          }
        }, 300);
      }
    });
}

function loadAll() {
  fetch(DB + '.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('conn').textContent = '● Verbunden';
      document.getElementById('conn').style.color = '#7dff9a';
      if (!data) return;
      var entries = Object.entries(data).sort(function(a, b) {
        return (a[1].timestamp || 0) - (b[1].timestamp || 0);
      });
      entries.forEach(function(e) {
        renderCard(e[0], e[1], false);
        lastTimestamp = Math.max(lastTimestamp, e[1].timestamp || 0);
      });
    })
    .catch(function() {
      document.getElementById('conn').textContent = '● Verbindungsfehler';
      document.getElementById('conn').style.color = '#ff6b6b';
    });
}

var pollErrors = 0;

function pollNew() {
  fetch(DB + '.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      pollErrors = 0;
      document.getElementById('conn').textContent = '● Verbunden';
      document.getElementById('conn').style.color = '#7dff9a';
      if (!data) return;
      Object.entries(data).forEach(function(e) {
        var key = e[0], order = e[1];
        var ts = order.timestamp || 0;
        if (!document.getElementById('card-' + key) && ts > lastTimestamp) {
          renderCard(key, order, true);
          lastTimestamp = Math.max(lastTimestamp, ts);
        }
      });
    })
    .catch(function() {
      pollErrors++;
      if (pollErrors >= 2) {
        document.getElementById('conn').textContent = '● Verbindungsfehler – wird wiederholt...';
        document.getElementById('conn').style.color = '#ff6b6b';
      }
    });
}

// Login handles loadAll and polling

</script>
</body>
</html>
