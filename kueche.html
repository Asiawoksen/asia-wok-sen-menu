<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Küche – Asia Wok Sen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0b5b34; min-height: 100vh; padding-bottom: 20px; }

#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: white; border-radius: 24px; padding: 36px 28px; text-align: center; width: 90%; max-width: 320px; }
.login-box .icon { font-size: 48px; margin-bottom: 12px; }
.login-box h2 { color: #0b5b34; margin-bottom: 6px; font-size: 22px; }
.login-box p { color: #888; font-size: 14px; margin-bottom: 24px; }
.login-box input { width: 100%; border: 2px solid #ddd; border-radius: 12px; padding: 13px; font-size: 24px; text-align: center; letter-spacing: 8px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #0b5b34; }
.login-box .btn-login { width: 100%; background: #0b5b34; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
.pw-error { color: #d81b86; font-size: 13px; margin-top: 10px; display: none; font-weight: 700; }

#main-content { display: none; }
header { background: #062d1b; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; gap: 8px; flex-wrap: wrap; }
header h1 { font-size: 16px; }
#conn { font-size: 12px; }
#badge { background: #d81b86; color: white; border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: 14px; }
.btn-sound { background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 13px; }

#activate-banner { background: #d81b86; color: white; text-align: center; padding: 16px; font-size: 16px; font-weight: 800; cursor: pointer; border-bottom: 3px solid #a01060; }

/* Day tabs */
.day-tabs { display: flex; background: #062d1b; padding: 8px 14px; gap: 8px; overflow-x: auto; }
.day-tab { background: rgba(255,255,255,0.15); color: white; border: none; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.day-tab.active { background: white; color: #0b5b34; }

main { padding: 14px; max-width: 640px; margin: 0 auto; }
#empty { color: rgba(255,255,255,0.5); text-align: center; padding: 60px 20px; font-size: 18px; }

.card { background: white; border-radius: 18px; padding: 18px; margin-bottom: 14px; border-left: 6px solid #d81b86; animation: pop 0.4s ease; }
.card.done { border-left-color: #bbb; opacity: 0.55; }
.card.mitnehmen { border-left-color: #e65100; }
.card.abholung { border-left-color: #1565c0; }
@keyframes pop { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
.name-area { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tisch-label { font-size: 22px; font-weight: 900; color: #0b5b34; }
.type-badge { border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 800; color: white; }
.badge-hier { background: #0b5b34; }
.badge-mitnehmen { background: #e65100; }
.badge-abholung { background: #1565c0; }
.new-tag { background: #d81b86; color: white; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; }
.zeit-label { font-size: 12px; color: #888; white-space: nowrap; }

.order-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; gap: 8px; }
.order-row:last-of-type { border: none; }
.qty-tag { background: #0b5b34; color: white; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 800; margin-right: 4px; flex-shrink: 0; }
.item-note { font-size: 12px; color: #d81b86; padding: 2px 0 4px 28px; }

.total-row { text-align: right; font-weight: 900; color: #0b5b34; font-size: 16px; margin-top: 10px; }
.order-note { background: #fff8e1; border-left: 3px solid #ffc107; border-radius: 8px; padding: 8px 10px; font-size: 13px; color: #666; margin-top: 8px; }

.btn-row { display: flex; gap: 6px; margin-top: 12px; }
.btn-fertig { flex: 2; border: none; border-radius: 12px; padding: 13px 8px; font-size: 14px; font-weight: 800; cursor: pointer; background: #0b5b34; color: white; }
.btn-fertig.done-state { background: #ccc; color: #555; }
.btn-pay { flex: 2; border: none; border-radius: 12px; padding: 13px 8px; font-size: 14px; font-weight: 800; cursor: pointer; background: #ff9800; color: white; }
.btn-pay.paid { background: #4caf50; }
.btn-del { flex: 1; border: none; border-radius: 12px; padding: 13px 8px; font-size: 14px; font-weight: 800; cursor: pointer; background: #f44336; color: white; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="icon">🍳</div>
    <h2>Küche – Asia Wok Sen</h2>
    <p>Chỉ dành cho nhân viên</p>
    <input type="password" id="pw-input" placeholder="****" maxlength="20"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="btn-login" onclick="checkPw()">Đăng nhập</button>
    <div class="pw-error" id="pw-error">❌ Sai mật khẩu. Thử lại!</div>
  </div>
</div>

<!-- MAIN -->
<div id="main-content">
  <header>
    <span id="conn" style="color:#aaa">⏳ Đang kết nối...</span>
    <h1>🍳 Bếp – Asia Wok Sen</h1>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn-sound" id="btn-sound" onclick="toggleSound()">🔔 BẬT</button>
      <span id="badge">0</span>
    </div>
  </header>

  <div id="activate-banner" onclick="activateAudio()">
    👆 Bấm vào đây để bật âm thanh thông báo!
  </div>

  <!-- Day tabs -->
  <div class="day-tabs" id="day-tabs"></div>

  <main>
    <div id="empty">⏳ Chờ đơn hàng mới...</div>
    <div id="list"></div>
  </main>
</div>

<script>
// ════════ PASSWORD ════════
var PASSWORD = '1234';

function checkPw() {
  var v = document.getElementById('pw-input').value;
  if (v === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    startApp();
  } else {
    var err = document.getElementById('pw-error');
    err.style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    setTimeout(function(){ err.style.display = 'none'; }, 3000);
  }
}

// ════════ AUDIO ════════
var soundOn = true;
var audioCtx = null;
var audioUnlocked = false;

function activateAudio() {
  if (audioUnlocked) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var buf = audioCtx.createBuffer(1, 1, 22050);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
    audioUnlocked = true;
    document.getElementById('activate-banner').innerHTML = '✅ Âm thanh đã được bật! Sẽ có tiếng khi có đơn mới.';
    document.getElementById('activate-banner').style.background = '#4caf50';
    setTimeout(function(){
      document.getElementById('activate-banner').style.display = 'none';
    }, 2000);
    setTimeout(beep, 300);
  } catch(e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('btn-sound').textContent = soundOn ? '🔔 BẬT' : '🔕 TẮT';
}

function beep() {
  if (!soundOn || !audioUnlocked || !audioCtx) return;
  try {
    // Bíp 10 lần
    for (var i = 0; i < 10; i++) {
      (function(idx) {
        var delay = idx * 300;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = idx % 2 === 0 ? 880 : 660;
        var t = audioCtx.currentTime + delay / 1000;
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.6, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t);
        osc.stop(t + 0.25);
      })(i);
    }
  } catch(e) {}
}

// ════════ NOTIFICATION ════════
function requestNotif() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function showNotif(order) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var type = order.orderType === 'mitnehmen' ? '🥡 Mang về'
           : order.orderType === 'abholung'  ? '📞 Abholung ' + (order.pickupTime || '')
           : '🍽️ Ăn tại quán';
  var itemList = (order.items || []).slice(0, 3).map(function(i){ return i.qty + '× ' + i.name; }).join(', ');
  new Notification('🍳 Đơn mới – ' + (order.tisch || '?'), {
    body: type + '\n' + itemList + '\nTổng: ' + order.total + ' €',
    tag: 'order-' + Date.now(),
    requireInteraction: true
  });
}

// ════════ DAY TABS ════════
var allOrders = {}; // key -> order
var currentDay = '';

function getDateStr(timestamp) {
  if (!timestamp) return 'Hôm nay';
  var d = new Date(timestamp);
  var today = new Date();
  var tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);
  var yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);

  var ds = d.toDateString();
  if (ds === today.toDateString()) return 'Hôm nay';
  if (ds === tomorrow.toDateString()) return 'Ngày mai';
  if (ds === yesterday.toDateString()) return 'Hôm qua';
  return d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear();
}

function groupByDay(orders) {
  var days = {};
  Object.entries(orders).forEach(function(e) {
    var key = e[0], order = e[1];
    var day = getDateStr(order.timestamp);
    if (!days[day]) days[day] = {};
    days[day][key] = order;
  });
  return days;
}

function renderDayTabs(days) {
  var tabsEl = document.getElementById('day-tabs');
  var dayKeys = Object.keys(days);

  // Sort: Hôm nay first, then others
  dayKeys.sort(function(a, b) {
    if (a === 'Hôm nay') return -1;
    if (b === 'Hôm nay') return 1;
    if (a === 'Ngày mai') return -1;
    if (b === 'Ngày mai') return 1;
    return 0;
  });

  tabsEl.innerHTML = '';
  if (dayKeys.length === 0) return;

  if (!currentDay || !dayKeys.includes(currentDay)) {
    currentDay = dayKeys[0];
  }

  dayKeys.forEach(function(day) {
    var count = Object.keys(days[day]).length;
    var btn = document.createElement('button');
    btn.className = 'day-tab' + (day === currentDay ? ' active' : '');
    btn.textContent = day + ' (' + count + ')';
    btn.onclick = function() {
      currentDay = day;
      renderDayTabs(groupByDay(allOrders));
      renderOrders(days[day]);
    };
    tabsEl.appendChild(btn);
  });
}

function renderOrders(orders) {
  var listEl = document.getElementById('list');
  listEl.innerHTML = '';

  var entries = Object.entries(orders)
    .sort(function(a, b) { return (b[1].timestamp||0) - (a[1].timestamp||0); });

  if (entries.length === 0) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  entries.forEach(function(e) {
    renderCard(e[0], e[1], false);
  });
}

// ════════ FIREBASE / ORDERS ════════
var DB = 'https://asia-wok-sen-default-rtdb.europe-west1.firebasedatabase.app/bestellungen';
var lastTs = 0;
var orderCount = 0;
var pollErrors = 0;

function renderCard(key, order, isNew) {
  if (isNew) {
    orderCount++;
    document.getElementById('badge').textContent = orderCount;
    beep();
    showNotif(order);
  }

  var typeClass = 'badge-hier';
  var typeText = '🍽️ Ăn tại quán';
  if (order.orderType === 'mitnehmen') { typeClass = 'badge-mitnehmen'; typeText = '🥡 Mang về'; }
  if (order.orderType === 'abholung')  { typeClass = 'badge-abholung';  typeText = '📞 Abholung' + (order.pickupTime ? ' lúc ' + order.pickupTime : '') + (order.pickupPhone ? ' – ☎ ' + order.pickupPhone : ''); }

  var rows = '';
  (order.items || []).forEach(function(it) {
    rows += '<div class="order-row">'
          + '<span><span class="qty-tag">' + it.qty + '×</span>' + it.name + '</span>'
          + '<span style="white-space:nowrap">' + parseFloat(it.subtotal||0).toFixed(2).replace('.',',') + ' €</span>'
          + '</div>';
    if (it.note) rows += '<div class="item-note">📝 ' + it.note + '</div>';
  });

  var noteHtml = order.note ? '<div class="order-note">📝 ' + order.note + '</div>' : '';
  var isDone   = order.status === 'fertig';
  var isPaid   = order.bezahlt === true;

  var card = document.createElement('div');
  card.id = 'card-' + key;
  card.className = 'card'
    + (isDone ? ' done' : '')
    + (order.orderType === 'mitnehmen' ? ' mitnehmen' : '')
    + (order.orderType === 'abholung'  ? ' abholung'  : '');

  card.innerHTML =
    '<div class="card-top">'
    + '<div class="name-area">'
    +   '<span class="tisch-label">👤 ' + (order.tisch||'?') + '</span>'
    +   '<span class="type-badge ' + typeClass + '">' + typeText + '</span>'
    +   (isNew ? '<span class="new-tag">MỚI!</span>' : '')
    + '</div>'
    + '<span class="zeit-label">' + (order.zeit||'') + '</span>'
    + '</div>'
    + rows
    + noteHtml
    + '<div class="total-row">Tổng: ' + (order.total||'0') + ' €</div>'
    + '<div class="btn-row">'
    +   '<button class="btn-fertig' + (isDone ? ' done-state' : '') + '" id="fertig-' + key + '" onclick="toggleFertig(\'' + key + '\')">'
    +     (isDone ? '↩ Mở lại' : '✅ Xong')
    +   '</button>'
    +   '<button class="btn-pay' + (isPaid ? ' paid' : '') + '" id="pay-' + key + '" onclick="togglePay(\'' + key + '\')">'
    +     (isPaid ? '💰 Đã thanh toán' : '💳 Chưa thanh toán')
    +   '</button>'
    +   '<button class="btn-del" onclick="delOrder(\'' + key + '\')">🗑</button>'
    + '</div>';

  document.getElementById('list').appendChild(card);
}

function toggleFertig(key) {
  var card = document.getElementById('card-' + key);
  var btn  = document.getElementById('fertig-' + key);
  var done = card.classList.contains('done');
  fetch(DB + '/' + key + '.json', { method:'PATCH', body: JSON.stringify({ status: done ? 'neu' : 'fertig' }) });
  card.classList.toggle('done');
  btn.classList.toggle('done-state');
  btn.textContent = done ? '✅ Xong' : '↩ Mở lại';
}

function togglePay(key) {
  var btn  = document.getElementById('pay-' + key);
  var paid = btn.classList.contains('paid');
  fetch(DB + '/' + key + '.json', { method:'PATCH', body: JSON.stringify({ bezahlt: !paid }) });
  btn.classList.toggle('paid');
  btn.textContent = paid ? '💳 Chưa thanh toán' : '💰 Đã thanh toán';
}

function delOrder(key) {
  if (!confirm('Xóa đơn hàng này?')) return;
  fetch(DB + '/' + key + '.json', { method:'DELETE' }).then(function() {
    delete allOrders[key];
    var card = document.getElementById('card-' + key);
    if (card) {
      card.style.transition = 'opacity 0.3s';
      card.style.opacity = '0';
      setTimeout(function(){
        card.remove();
        orderCount = Math.max(0, orderCount - 1);
        document.getElementById('badge').textContent = orderCount;
        // Refresh tabs
        var days = groupByDay(allOrders);
        renderDayTabs(days);
        if (days[currentDay]) renderOrders(days[currentDay]);
        else document.getElementById('empty').style.display = 'block';
      }, 300);
    }
  });
}

function loadAll() {
  fetch(DB + '.json')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      document.getElementById('conn').textContent = '● Đã kết nối';
      document.getElementById('conn').style.color = '#7dff9a';
      if (!data) return;

      allOrders = {};
      Object.entries(data).forEach(function(e) {
        allOrders[e[0]] = e[1];
        lastTs = Math.max(lastTs, e[1].timestamp||0);
      });

      var days = groupByDay(allOrders);
      renderDayTabs(days);
      if (currentDay && days[currentDay]) renderOrders(days[currentDay]);
    })
    .catch(function(){
      document.getElementById('conn').textContent = '● Lỗi kết nối';
      document.getElementById('conn').style.color = '#ff6b6b';
    });
}

function pollNew() {
  fetch(DB + '.json')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      pollErrors = 0;
      document.getElementById('conn').textContent = '● Đã kết nối';
      document.getElementById('conn').style.color = '#7dff9a';
      if (!data) return;

      var hasNew = false;
      Object.entries(data).forEach(function(e) {
        var key = e[0], order = e[1];
        if ((order.timestamp||0) > lastTs) {
          allOrders[key] = order;
          lastTs = Math.max(lastTs, order.timestamp||0);
          hasNew = true;
          // If new order is for current day, add card
          var day = getDateStr(order.timestamp);
          if (day === currentDay) {
            if (!document.getElementById('card-' + key)) {
              renderCard(key, order, true);
            }
          } else {
            // New order in different day — show notification and refresh tabs
            beep();
            showNotif(order);
          }
        }
      });

      if (hasNew) {
        var days = groupByDay(allOrders);
        renderDayTabs(days);
      }
    })
    .catch(function(){
      pollErrors++;
      if (pollErrors >= 2) {
        document.getElementById('conn').textContent = '● Đang kết nối lại...';
        document.getElementById('conn').style.color = '#ff9800';
      }
    });
}

function startApp() {
  requestNotif();
  loadAll();
  setInterval(pollNew, 3000);
}
</script>
</body>
</html>
